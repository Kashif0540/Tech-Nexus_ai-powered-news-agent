    <script>
      // React load hone se pehle theme set karte hain taake white flash na ho
      try {
        const theme = JSON.parse(localStorage.getItem('technexus:theme'));
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
